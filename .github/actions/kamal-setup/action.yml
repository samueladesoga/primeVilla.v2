name: Kamal setup
description: Ruby, Docker Buildx and SSH access to the deploy server

inputs:
  ruby-version:
    required: true
  ssh-private-key:
    required: true
  server:
    description: Host from config/deploy.yml
    default: 195.201.147.221

runs:
  using: composite
  steps:
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ inputs.ruby-version }}
        bundler-cache: true

    - uses: docker/setup-buildx-action@v3

    - uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ inputs.ssh-private-key }}

    # Pinned host keys instead of running ssh-keyscan on each deploy: a scan from the
    # runner left known_hosts without a usable ed25519 entry (Kamal failed with
    # HostKeyMismatch), and pinning also stops a spoofed server from being trusted.
    # Update these if the server is rebuilt (ssh-keyscan <server>).
    - name: Trust the deploy server's host key
      shell: bash
      run: |
        mkdir -p ~/.ssh
        cat >> ~/.ssh/known_hosts <<'KNOWN_HOSTS'
        ${{ inputs.server }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDY6K3E2GwgITe+QQ9vI987uuevorXIZnB6vNQGXxvN6
        ${{ inputs.server }} ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBNdlhuaGghNKKM4VY+7hdfvRreQiRvkz3ICoIcsVAiGKauSP/Czo5DMKtsiY8wS3mePPqSl1+dFaaMuhK6BfOLI=
        KNOWN_HOSTS
